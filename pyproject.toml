[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bootcamp"
version = "0.1.0"
description = "Helper utilities (plotting, MPI demos) for the ALCF Intro to HPC Bootcamp."
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Sam Foreman" }]
license = { text = "MIT" }
dependencies = [
    "numpy",
    "matplotlib",
    "plotly",
    "pandas",
    "scikit-learn",
    "mpi4py",
    "rich",
]

[project.optional-dependencies]
# Distributed / accelerator extras used by the [01]-[03] training examples.
# Installed on ALCF/NERSC systems; not required for the CPU-only notebooks.
dist = ["ezpz", "torch"]

[project.urls]
Homepage = "https://saforem2.github.io/intro-hpc-bootcamp/"
Repository = "https://github.com/saforem2/intro-hpc-bootcamp"

[tool.setuptools.packages.find]
where = ["src"]
