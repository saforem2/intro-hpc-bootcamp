website:
  google-analytics: "GTM-MRCG68M5"
  bread-crumbs: true
  title: "Intro to HPC Bootcamp"
  description: "An introduction to High Performance Computing (HPC) and Artificial Intelligence (AI) for scientific applications, with a focus on practical skills and hands-on experience."
  image: assets/thumbnail.png
  favicon: assets/favicon-sf.svg
  page-navigation: true
  site-url: "https://saforem2.github.io/intro-hpc-bootcamp/"
  repo-url: https://github.com/saforem2/intro-hpc-bootcamp
  repo-actions: [source, edit, issue]
  # the Quarto project root is content/, but on GitHub the sources live under
  # content/ — so tell repo-actions to prepend it, else "View source"/"Edit" 404.
  repo-subdir: content
  comments:
    giscus:
      repo: saforem2/intro-hpc-bootcamp
      repo-id: R_kgDOPQ7DhQ
      category: Announcements
      category-id: DIC_kwDOPQ7Dhc4CtXSQ
      mapping: pathname
      reactions-enabled: true
      input-position: bottom
      theme: preferred_color_scheme
      language: en
  open-graph: true
  twitter-card:
    site: "saforem2"

  sidebar:
    style: "docked"
    # style: "floating"
    align: left
    search: true
    pinned: true
    title: "Intro to HPC Bootcamp"
    # search: true
    # contents: auto
    collapse-level: 1
    # contents: auto
    tools:
      - icon: home
        href: "index.qmd"
        text: "Home"
      - icon: github
        href: "https://github.com/saforem2/intro-hpc-bootcamp"
        text: "GitHub"

    id: sidebar
    contents:
      - id: 00-intro-AI-HPC
        section: "[00] Intro to AI and HPC"
        href: "00-intro-AI-HPC/index.qmd"
