format:
  html:
    respect-user-color-scheme: true
    date-modified: last-modified
    link-external-newwindow: true
    link-external-icon: false
    callout-appearance: simple
    code-tools: true
    code-link: true
    code-line-numbers: true
    toc: true
    self-contained: false
    default-image-extension: svg
    toc-title: ""
    page-layout: article
    fig-width: 6.4
    fig-height: 4.8
    # NB: docked-nav sidebar width is set via $grid-sidebar-width in
    # css/common.scss (the `grid:` option here only sizes the right margin).
    fig-align: center
    fig-responsive: true
    anchor-sections: true
    code-overflow: scroll
    code-copy: hover
    code-summary: " "
    citations-hover: true
    crossrefs-hover: true
    html-math-method: katex
    footnotes-hover: true
    section-divs: true
    # highlight-style: plain
    highlight-style:
      light: github
      dark: github-dark
    mermaid:
      layout: elk
      useMaxWidth: true
    theme:
      dark:
        - css/common.scss
        - css/dark.scss
        - css/syntax-dark.scss
        - css/callout-cards.scss
        - default
      light:
        - css/common.scss
        - css/light.scss
        - css/syntax-light.scss
        - css/callout-cards.scss
        - default
